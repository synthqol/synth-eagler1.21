<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Synth MCWL - Server</title>

  <!-- External Stylesheet -->
  <link rel="stylesheet" href="style.css">

  <style>
    * {
      box-sizing: border-box;
    }

    /* Clean Minimalist Dark Layout */
    body {
      background-color: #000000 !important;
      color: #ffffff !important;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 48px 56px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Top Branding Header */
    .top-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.25rem;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 72px;
      letter-spacing: -0.01em;
    }

    .top-brand img {
      width: 20px;
      height: 20px;
      object-fit: contain;
    }

    /* Main Server Heading */
    .welcome-title {
      font-size: 5.5rem;
      font-weight: 700;
      letter-spacing: -0.04em;
      margin: 0 0 32px 0;
      color: #ffffff;
      line-height: 1;
    }

    /* Navigation / Back Action Buttons */
    .auth-buttons-container {
      display: flex;
      gap: 16px;
      margin-bottom: 72px;
    }

    .btn-auth {
      background-color: #ffffff;
      color: #000000;
      border: 1px solid #ffffff;
      border-radius: 40px;
      padding: 16px 42px;
      font-size: 1.35rem;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      text-decoration: none;
      display: inline-block;
      transition: opacity 0.15s ease;
    }

    .btn-auth:hover {
      opacity: 0.9;
    }

    .btn-auth-outline {
      background-color: transparent;
      color: #ffffff;
      border: 1px solid #ffffff;
    }

    /* Subtitle / Server Info Block */
    .site-info-block {
      margin-bottom: 96px;
      max-width: 540px;
    }

    .site-subtitle {
      font-size: 1.75rem;
      font-weight: 600;
      margin: 0 0 6px 0;
      color: #ffffff;
      letter-spacing: -0.02em;
    }

    .site-url {
      font-size: 1.25rem;
      font-weight: 500;
      color: #888888;
      margin: 0;
      line-height: 1.35;
      letter-spacing: -0.01em;
    }

    /* Server Options Section */
    .clients-section-title {
      font-size: 1.4rem;
      font-weight: 500;
      color: #ffffff;
      margin-bottom: 24px;
      letter-spacing: -0.01em;
    }

    .clients-grid {
      display: flex;
      gap: 56px;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .client-card {
      cursor: pointer;
      display: flex;
      flex-direction: column;
      text-decoration: none;
    }

    .client-card:hover .client-name {
      opacity: 0.75;
    }

    .client-name {
      font-size: 2.4rem;
      font-weight: 700;
      color: #ffffff;
      margin: 0 0 10px 0;
      letter-spacing: -0.03em;
      transition: opacity 0.15s ease;
    }

    .client-desc {
      font-size: 0.85rem;
      color: #888888;
      margin: 0;
      max-width: 180px;
      line-height: 1.4;
      font-weight: 500;
    }

    /* Responsive adjustments for mobile */
    @media (max-width: 900px) {
      body { padding: 32px 24px; }
      .welcome-title { font-size: 3.8rem; }
      .site-subtitle { font-size: 1.35rem; }
      .site-url { font-size: 1.05rem; }
      .clients-grid { gap: 36px; }
      .btn-auth { font-size: 1.1rem; padding: 12px 32px; }
    }
  </style>
</head>
<body>

  <!-- Top Header Logo -->
  <div class="top-brand">
    <img src="/icon.png" alt="Logo">
    <span>Synth MCWL</span>
  </div>
  
  <!-- Info block -->
  <div class="site-info-block">
    <p class="site-subtitle">Synth Multiplayer</p>
    <p class="site-url">Select a build below to connect to the server.</p>
  </div>

  <!-- Server Launch Options -->
  <div class="clients-section-title">Launch Options</div>
  <div class="clients-grid">
    <a href="/js" class="client-card">
      <h3 class="client-name">JS</h3>
      <p class="client-desc">Standard JavaScript Client (/game.html)</p>
    </a>

    <a href="/wasm" class="client-card">
      <h3 class="client-name">WASM</h3>
      <p class="client-desc">WebAssembly High-Performance Build (/wasm.html)</p>
    </a>
  </div>

</body>
</html>
